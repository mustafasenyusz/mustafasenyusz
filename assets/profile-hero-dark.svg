<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Şenyüz animated developer profile</title>
  <desc id="desc">Animated terminal-style profile card for a frontend-focused mobile developer learning backend and databases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".52" stop-color="#081127"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portraitReveal">
      <rect x="48" y="102" width="360" height="0">
        <animate attributeName="height" from="0" to="360" dur="2.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1180" height="610" rx="30" fill="url(#bg)"/>
  <rect width="1180" height="610" rx="30" fill="url(#grid)"/>
  <circle cx="132" cy="90" r="250" fill="url(#violetGlow)">
    <animate attributeName="r" values="220;275;220" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="520" r="270" fill="url(#cyanGlow)">
    <animate attributeName="cx" values="1010;1060;1010" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g fill="#CBD5E1" opacity=".32">
    <circle cx="82" cy="67" r="2"><animate attributeName="opacity" values=".15;.8;.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1112" cy="92" r="2"><animate attributeName="opacity" values=".7;.12;.7" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="548" r="1.8"><animate attributeName="opacity" values=".2;.75;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="505" cy="60" r="1.5"><animate attributeName="cy" values="60;48;60" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="422" height="554" rx="22" fill="#0F172A" fill-opacity=".86" stroke="#FFFFFF" stroke-opacity=".09"/>
    <rect x="472" y="28" width="680" height="554" rx="22" fill="#0F172A" fill-opacity=".82" stroke="#FFFFFF" stroke-opacity=".09"/>
  </g>

  <g>
    <circle cx="60" cy="60" r="6" fill="#FB7185"/>
    <circle cx="82" cy="60" r="6" fill="#FBBF24"/>
    <circle cx="104" cy="60" r="6" fill="#34D399"/>
    <text x="132" y="66" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">portrait.sh</text>
    <text x="420" y="66" text-anchor="end" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">● LIVE</text>
  </g>

  <g clip-path="url(#portraitReveal)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="url(#accent)" filter="url(#glow)">
    <text x="106" y="138">╭────────────────╮</text>
    <text x="106" y="169">│   MUSTAFA.S     │</text>
    <text x="106" y="200">│                │</text>
    <text x="106" y="231">│    ╭──────╮    │</text>
    <text x="106" y="262">│   ╱  ◉  ◉  ╲   │</text>
    <text x="106" y="293">│  │    ▿     │  │</text>
    <text x="106" y="324">│  │  ╰───╯   │  │</text>
    <text x="106" y="355">│   ╲________╱   │</text>
    <text x="106" y="386">│      ╱╲        │</text>
    <text x="106" y="417">│  ╭──╯  ╰──╮    │</text>
    <text x="106" y="448">╰────────────────╯</text>
  </g>

  <rect x="54" y="102" width="370" height="350" rx="16" fill="none" stroke="url(#accent)" stroke-opacity=".32"/>
  <rect x="54" y="102" width="370" height="3" rx="2" fill="#22D3EE" opacity=".7">
    <animate attributeName="y" values="102;449;102" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;.8;.15" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="492" fill="#64748B" font-size="13">$ profile --status</text>
    <circle cx="67" cy="526" r="5" fill="#34D399">
      <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.45;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="531" fill="#CBD5E1" font-size="14">building, learning, improving</text>
    <text x="62" y="558" fill="#475569" font-size="12">frontend_first: true</text>
  </g>

  <g>
    <circle cx="504" cy="60" r="6" fill="#FB7185"/>
    <circle cx="526" cy="60" r="6" fill="#FBBF24"/>
    <circle cx="548" cy="60" r="6" fill="#34D399"/>
    <text x="576" y="66" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">mustafa@github:~</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="512" y="122" fill="#34D399" font-size="15">➜</text>
    <text x="538" y="122" fill="#94A3B8" font-size="15">whoami</text>
    <text x="512" y="166" fill="#F8FAFC" font-size="22">Hi 👋  I'm</text>
    <text x="512" y="214" fill="url(#accent)" font-size="42" font-weight="800">Mustafa Şenyüz</text>

    <g font-size="19" font-weight="600">
      <text x="512" y="257" fill="#22D3EE" opacity="0">Frontend-focused Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.28;.34;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="512" y="257" fill="#A78BFA" opacity="0">React Native • Expo • TypeScript
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.34;.40;.62;.68" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="512" y="257" fill="#34D399" opacity="0">Learning backend &amp; database design
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.68;.74;.94;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <rect x="512" y="266" width="12" height="3" rx="1" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-size="14">
      <text x="512" y="311" fill="#64748B">focus</text>
      <text x="610" y="311" fill="#E2E8F0">mobile-first product interfaces</text>
      <text x="512" y="339" fill="#64748B">backend</text>
      <text x="610" y="339" fill="#E2E8F0">Node.js + Express</text>
      <text x="512" y="367" fill="#64748B">database</text>
      <text x="610" y="367" fill="#E2E8F0">growing with PostgreSQL</text>
      <text x="512" y="395" fill="#64748B">location</text>
      <text x="610" y="395" fill="#E2E8F0">Türkiye</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <g transform="translate(512 432)"><rect width="118" height="34" rx="17" fill="#61DAFB" fill-opacity=".11" stroke="#61DAFB" stroke-opacity=".35"/><text x="59" y="22" text-anchor="middle" fill="#67E8F9">React Native</text></g>
    <g transform="translate(642 432)"><rect width="72" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".18"/><text x="36" y="22" text-anchor="middle" fill="#E2E8F0">Expo</text></g>
    <g transform="translate(726 432)"><rect width="104" height="34" rx="17" fill="#3178C6" fill-opacity=".16" stroke="#60A5FA" stroke-opacity=".35"/><text x="52" y="22" text-anchor="middle" fill="#93C5FD">TypeScript</text></g>
    <g transform="translate(842 432)"><rect width="78" height="34" rx="17" fill="#764ABC" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".35"/><text x="39" y="22" text-anchor="middle" fill="#C4B5FD">Redux</text></g>
    <g transform="translate(932 432)"><rect width="92" height="34" rx="17" fill="#34D399" fill-opacity=".11" stroke="#34D399" stroke-opacity=".34"/><text x="46" y="22" text-anchor="middle" fill="#6EE7B7">Node.js</text></g>

    <g transform="translate(512 480)"><rect width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".18"/><text x="46" y="22" text-anchor="middle" fill="#E2E8F0">Express</text></g>
    <g transform="translate(616 480)"><rect width="110" height="34" rx="17" fill="#4169E1" fill-opacity=".14" stroke="#60A5FA" stroke-opacity=".35"/><text x="55" y="22" text-anchor="middle" fill="#93C5FD">PostgreSQL</text></g>
    <g transform="translate(738 480)"><rect width="68" height="34" rx="17" fill="#F97316" fill-opacity=".12" stroke="#FB923C" stroke-opacity=".35"/><text x="34" y="22" text-anchor="middle" fill="#FDBA74">Git</text></g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M512 544H1112" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="512" y="568" fill="#64748B" font-size="12">github.com/mustafasenyusz</text>
    <text x="1112" y="568" text-anchor="end" fill="#22D3EE" font-size="12">open to the next challenge ↗</text>
  </g>

  <rect x="2" y="2" width="1176" height="606" rx="28" fill="none" stroke="url(#accent)" stroke-opacity=".42" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".22;.62;.22" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
